blueprint:
  name: GardenGlow Bewässerungs-Blueprint
  description: |
    Bewässert ein GardenGlow-Beet anhand der vorhergesagten Bewässerungsdauer.

    Wichtig: Ein Home-Assistant-Blueprint kann den benötigten Webservice-Aufruf
    nicht selbst als neue Integration anlegen. Lege deshalb einmalig den
    folgenden RESTful Command in deiner Home-Assistant configuration.yaml an
    und starte Home Assistant neu bzw. lade die YAML-Konfiguration neu:

    rest_command:
      gardenglow_get_irrigation_minutes:
        url: "__GARDENGLOW_BASE_URL__/api/locations/{{ bed_id }}/irrigation-prediction"
        method: GET
        headers:
          X-API-Key: "{{ api_token }}"

    Danach kann diese Blueprint-Automation den Command
    rest_command.gardenglow_get_irrigation_minutes verwenden. Beim Ausführen
    übergibt der Blueprint Beet-ID und API-Token an den RESTful Command. Die
    GardenGlow-Antwort wird per response_variable gelesen;
    daraus wird predicted_minutes extrahiert, optional in einen input_number-
    Helfer geschrieben und anschließend die ausgewählte Switch- oder
    Valve-Entität genau für diese Dauer eingeschaltet bzw. geöffnet.
  domain: automation
  input:
    api_token:
      name: GardenGlow API Token
      description: Widget-API-Key aus GardenGlow.
      selector:
        text:
          type: password
    bed_id:
      name: Beet-ID
      description: ID des GardenGlow-Beets, für das die Bewässerungsdauer vorhergesagt wird.
      default: 1
      selector:
        number:
          min: 1
          mode: box
          step: 1
    irrigation_start_time:
      name: Startzeit
      description: Uhrzeit, zu der die Bewässerungs-Automation täglich automatisch startet.
      default: "06:00:00"
      selector:
        time:
    watering_entity:
      name: Bewässerungs-Entität
      description: Switch oder Valve, das für die vorhergesagte Dauer eingeschaltet bzw. geöffnet wird.
      selector:
        entity:
          domain:
            - switch
            - valve
    minutes_helper_entity:
      name: Minuten-Helfer (optional)
      description: Optionaler input_number-Helfer, in den die vorhergesagte Dauer geschrieben wird.
      default: ""
      selector:
        entity:
          domain: input_number
          multiple: false

mode: single

variables:
  api_token: !input api_token
  bed_id: !input bed_id
  irrigation_start_time: !input irrigation_start_time
  watering_entity: !input watering_entity
  minutes_helper_entity: !input minutes_helper_entity

trigger:
  - platform: time
    at: !input irrigation_start_time

action:
  - action: rest_command.gardenglow_get_irrigation_minutes
    data:
      api_token: "{{ api_token }}"
      bed_id: "{{ bed_id }}"
    response_variable: gardenglow_response

  - variables:
      gardenglow_payload: >-
        {{ gardenglow_response.content | default('{}') | from_json }}
      irrigation_minutes: >-
        {{ gardenglow_payload.predicted_minutes | default(0) | float(0) }}
      watering_domain: "{{ watering_entity.split('.')[0] }}"

  - if:
      - condition: template
        value_template: "{{ minutes_helper_entity | default('') | length > 0 }}"
    then:
      - action: input_number.set_value
        target:
          entity_id: "{{ minutes_helper_entity }}"
        data:
          value: "{{ irrigation_minutes }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ watering_domain == 'valve' }}"
        sequence:
          - action: valve.open_valve
            target:
              entity_id: "{{ watering_entity }}"
          - delay:
              minutes: "{{ irrigation_minutes }}"
          - action: valve.close_valve
            target:
              entity_id: "{{ watering_entity }}"
      - conditions:
          - condition: template
            value_template: "{{ watering_domain == 'switch' }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ watering_entity }}"
          - delay:
              minutes: "{{ irrigation_minutes }}"
          - action: switch.turn_off
            target:
              entity_id: "{{ watering_entity }}"
    default:
      - stop: watering_entity muss ein switch.* oder valve.* sein.
        error: true
